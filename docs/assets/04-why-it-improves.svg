<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SolutionScope 提升机制与开发集结果</title>
  <desc id="desc">对比单次直接回答与证据规划加覆盖约束工作流，并展示三项完整性召回指标、未变化指标和成本。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="9" dy="12" stdDeviation="0" flood-color="#1b1626" flood-opacity="1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1626"/>
    </marker>
    <style>
      .cn{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#1b1626}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1b1626;letter-spacing:1.5px}
      .small{font-size:22px}.body{font-size:27px}.label{font-size:24px;font-weight:700}.head{font-size:39px;font-weight:800}.big{font-size:60px;font-weight:900}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4efff"/>
  <text class="mono small" x="70" y="72">WHY IT IMPROVES · DEV EVALUATION</text>
  <text class="cn big" x="70" y="145">提升来自流程约束，不是模型突然变聪明。</text>
  <text class="cn body" x="70" y="192" fill="#5f576d">同一低推理模型、同一冻结证据池：改变的是任务组织方式，以及是否逐项核对覆盖。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="245" width="650" height="240" rx="28" fill="#ff9375" stroke="#1b1626" stroke-width="4"/>
  </g>
  <text class="mono label" x="105" y="292">A · ONE-PASS DIRECT ANSWER</text>
  <text class="cn head" x="105" y="350">证据池 → 一次回答 → 摘要压缩</text>
  <text class="cn body" x="105" y="404">模型倾向先概括“说了什么”，</text>
  <text class="cn body" x="105" y="442">嵌套标识、评估目标和方法容易在压缩中丢失。</text>

  <line x1="742" y1="365" x2="850" y2="365" stroke="#1b1626" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="870" y="245" width="660" height="240" rx="28" fill="#a98dff" stroke="#1b1626" stroke-width="4"/>
  </g>
  <text class="mono label" x="905" y="292">B · SOLUTIONSCOPE WORKFLOW</text>
  <text class="cn head" x="905" y="350">先规划证据，再冻结覆盖清单</text>
  <text class="cn body" x="905" y="404">证据筛选、逐项处置和结构化回答分开完成；</text>
  <text class="cn body" x="905" y="442">未覆盖标识会显式暴露，而不是被流畅措辞掩盖。</text>

  <text class="mono label" x="70" y="570">OBSERVED COMPLETENESS GAINS</text>
  <g filter="url(#shadow)">
    <rect x="70" y="605" width="420" height="155" rx="24" fill="#55d9c5" stroke="#1b1626" stroke-width="4"/>
  </g>
  <text class="cn label" x="100" y="650">关键标识召回</text>
  <text class="cn big" x="100" y="716">+33.3 pp</text>
  <text class="mono small" x="330" y="710">74/111 → 111/111</text>

  <g filter="url(#shadow)">
    <rect x="565" y="605" width="470" height="155" rx="24" fill="#ffd260" stroke="#1b1626" stroke-width="4"/>
  </g>
  <text class="cn label" x="595" y="650">评估目标召回</text>
  <text class="cn big" x="595" y="716">+47.1 pp</text>
  <text class="mono small" x="840" y="710">37/70 → 70/70</text>

  <g filter="url(#shadow)">
    <rect x="1110" y="605" width="420" height="155" rx="24" fill="#ffffff" stroke="#1b1626" stroke-width="4"/>
  </g>
  <text class="cn label" x="1140" y="650">评估方法召回</text>
  <text class="cn big" x="1140" y="716">+11.8 pp</text>
  <text class="mono small" x="1353" y="710">15/17 → 17/17</text>

  <rect x="70" y="810" width="525" height="48" rx="24" fill="#1b1626"/>
  <text x="95" y="842" font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">已经满分：证据绑定 12/12 · 验收边界 6/6</text>
  <rect x="620" y="810" width="360" height="48" rx="24" fill="#ff9375" stroke="#1b1626" stroke-width="3"/>
  <text class="cn small" x="646" y="842" font-weight="700">代价：Token 使用约 1.95×</text>
  <text class="mono small" x="1010" y="842">gpt-5.4-mini / low · DEV n=6 · NO GENERALIZATION CLAIM</text>
</svg>
